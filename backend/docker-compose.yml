services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orb
      POSTGRES_USER: orb
      POSTGRES_PASSWORD: orb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orb -d orb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://orb:orb@db:5432/orb
      SUPABASE_URL: ${SUPABASE_URL:-${VITE_SUPABASE_URL:-}}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY:-}}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      ORB_LLM_API_KEY: ${ORB_LLM_API_KEY:-}
      ORB_EMBEDDING_API_KEY: ${ORB_EMBEDDING_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-}
      SHOPIFY_THE_DEARIST_DOMAIN: ${SHOPIFY_THE_DEARIST_DOMAIN:-}
      SHOPIFY_THE_DEARIST_TOKEN: ${SHOPIFY_THE_DEARIST_TOKEN:-}
      SHOPIFY_ADMIN_API_VERSION: ${SHOPIFY_ADMIN_API_VERSION:-2025-10}
      ENV: dev
      AUTH_DISABLED: "true"
      CORS_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://orb:orb@db:5432/orb
      ENV: dev
      AUTH_DISABLED: "true"
      WORKER_MODE: crawl
      ENABLE_JS_RENDER: "false"
    depends_on:
      db:
        condition: service_healthy

  renderer:
    profiles: ["render"]
    build:
      context: .
      dockerfile: Dockerfile.playwright
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://orb:orb@db:5432/orb
      ENV: dev
      AUTH_DISABLED: "true"
      WORKER_MODE: render
      ENABLE_JS_RENDER: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
